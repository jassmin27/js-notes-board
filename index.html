<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>JS Notes Board</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <header class="app-header">
        <h1>JS Notes Board</h1>
        <p>Create, organise and search your notes.</p>
      </header>

      <main>
        <section class="add-note-section">
          <h2>Add Note</h2>

          <form class="add-note-form">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required />

            <label for="content">Content</label>
            <textarea id="content" name="content" rows="5" required></textarea>

            <label for="tags">Tags</label>
            <input
              type="text"
              id="tags"
              name="tags"
              placeholder="e.g. work, home"
            />

            <button type="submit" class="add-note-btn">Add Note</button>

            <p class="add-note-status"></p>
          </form>
        </section>

        <section class="notes-controls hidden">
          <h2>Find Notes</h2>

          <input
            type="search"
            id="search-notes-text"
            placeholder="Search by title or content"
          />

          <h3>Filter by tag</h3>
          <div class="filter-pills"></div>
        </section>

        <section class="notes-section hidden">
          <h2>All Notes</h2>

          <div class="note-cards"></div>
        </section>
      </main>
    </div>

    <template id="note-card-template">
      <article class="note-card">
        <header>
          <h3></h3>

          <button type="button" class="delete-note-btn">Delete</button>
        </header>

        <div class="content">
          <p></p>
        </div>

        <footer>
          <div class="tags"></div>
        </footer>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
